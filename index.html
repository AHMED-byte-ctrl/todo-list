<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do — Ahmed Nadeem</title>
<meta name="description" content="An interactive to-do list built with vanilla JavaScript, DOM manipulation, and localStorage.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <div class="app-header">
    <p class="eyebrow"><span class="dot"></span>Saved locally in your browser</p>
    <h1>To-Do List</h1>
    <p>Add tasks, check them off, and they'll still be here after you refresh.</p>
  </div>

  <div class="card">

    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <form class="add-form" id="addForm">
      <input
        type="text"
        id="taskInput"
        placeholder="What do you need to do?"
        maxlength="140"
        autocomplete="off"
      >
      <button type="submit" class="add-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Add
      </button>
    </form>

    <div class="filters" role="tablist" aria-label="Filter tasks">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <ul class="task-list" id="taskList"></ul>

    <div class="empty-state" id="emptyState" style="display:none;">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <p id="emptyMessage">No tasks yet</p>
      <p class="sub" id="emptySubMessage">Add your first task above to get started</p>
    </div>

    <div class="list-footer">
      <span id="itemsLeft">0 items left</span>
      <button class="clear-btn" id="clearCompleted">Clear completed</button>
    </div>

  </div>

  <p class="storage-note">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    Your tasks are stored only on this device
  </p>

</div>

<script src="script.js"></script>
</body>
</html>
